version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "MedOps@2024!"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    depends_on:
      - sqlserver
      - redis
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=MedOps;User=sa;Password=MedOps@2024!;TrustServerCertificate=True
      - Redis__ConnectionString=redis:6379
      - Jwt__Key=MedOpsSecretKeyForJwtTokenGeneration2024!
      - Jwt__Issuer=MedOps
      - Jwt__Audience=MedOps

volumes:
  sqlserver-data: